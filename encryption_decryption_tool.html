<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encryption & Decryption Tool</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      
      --accent-blue: #38bdf8;
      --encrypt-green: #10b981;
      --encrypt-green-hover: #059669;
      --decrypt-red: #f43f5e;
      --decrypt-red-hover: #e11d48;
      
      --secondary-btn-bg: #334155;
      --secondary-btn-hover: #475569;
      
      --error-bg: rgba(244, 63, 94, 0.15);
      --error-text: #fb7185;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;

      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
      
      --shadow-main: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-wrapper {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo-icon {
      font-size: 24px;
      color: var(--accent-blue);
    }

    .app-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    .crypto-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-main);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .field-hint {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .form-control {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.925rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .textarea-control {
      resize: vertical;
      min-height: 110px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .key-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .key-input-wrapper .form-control {
      padding-right: 44px;
    }

    .icon-button {
      position: absolute;
      right: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background-color 0.2s;
    }

    .icon-button:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-encrypt {
      background-color: var(--encrypt-green);
      color: #022c22;
    }

    .btn-encrypt:hover {
      background-color: var(--encrypt-green-hover);
      color: #ffffff;
    }

    .btn-decrypt {
      background-color: var(--decrypt-red);
      color: #ffffff;
    }

    .btn-decrypt:hover {
      background-color: var(--decrypt-red-hover);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.775rem;
      border-radius: var(--radius-sm);
    }

    .btn-secondary {
      background-color: var(--secondary-btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-btn-hover);
    }

    .text-link-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.775rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .text-link-btn:hover {
      color: var(--text-main);
    }

    .output-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-message {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-message.hidden {
      display: none;
    }

    .status-message.error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .status-message.success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    @media (max-width: 480px) {
      .actions-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-wrapper">
        <i class="fa-solid fa-lock logo-icon"></i>
      </div>
      <h1 class="app-title">Encryption & Decryption Tool</h1>
    </header>

    <main class="crypto-card">
      <div class="control-group">
        <label for="algorithm-select" class="input-label">Select Algorithm</label>
        <select id="algorithm-select" class="form-control">
          <option value="aes_cbc">AES-CBC</option>
          <option value="aes_ctr">AES-CTR</option>
          <option value="aes_gcm" selected>AES-GCM</option>
          <option value="autokey">Autokey Cipher</option>
          <option value="chacha20">ChaCha20-Poly1305</option>
          <option value="columnar">Columnar Transposition Cipher</option>
          <option value="fernet">Fernet Encryption</option>
          <option value="playfair">Playfair Cipher</option>
          <option value="vigenere">Vigenère Cipher</option>
        </select>
      </div>

      <div class="control-group" id="key-group">
        <label for="key-input" class="input-label">Key</label>
        <div class="key-input-wrapper">
          <input type="password" id="key-input" class="form-control" placeholder="Enter key or password...">
          <button type="button" id="toggle-key-btn" class="icon-button" title="Show/Hide Key">
            <i class="fa-solid fa-eye" id="toggle-key-icon"></i>
          </button>
        </div>
      </div>

      <div class="control-group">
        <div class="label-row">
          <label for="text-input" class="input-label">Input Text</label>
          <button type="button" id="clear-input-btn" class="text-link-btn">Clear</button>
        </div>
        <textarea id="text-input" class="form-control textarea-control" rows="5" placeholder="Enter your texts here..."></textarea>
      </div>

      <div class="actions-row">
        <button id="encrypt-btn" class="btn btn-encrypt">Encrypt</button>
        <button id="decrypt-btn" class="btn btn-decrypt">Decrypt</button>
      </div>

      <div id="status-message" class="status-message hidden"></div>

      <div class="control-group output-group">
        <div class="label-row">
          <label for="text-output" class="input-label">Output Result</label>
          <div class="output-actions">
            <button type="button" id="copy-btn" class="btn-sm btn-secondary">Copy</button>
            <button type="button" id="download-btn" class="btn-sm btn-secondary">Download</button>
            <button type="button" id="clear-output-btn" class="text-link-btn">Clear</button>
          </div>
        </div>
        <textarea id="text-output" class="form-control textarea-control" rows="5" readonly placeholder="Result will appear here..."></textarea>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const algorithmSelect = document.getElementById('algorithm-select');
      const algorithmHint = document.getElementById('algorithm-hint');
      const keyGroup = document.getElementById('key-group');
      const keyInput = document.getElementById('key-input');
      const toggleKeyBtn = document.getElementById('toggle-key-btn');
      const toggleKeyIcon = document.getElementById('toggle-key-icon');
      const textInput = document.getElementById('text-input');
      const textOutput = document.getElementById('text-output');
      const encryptBtn = document.getElementById('encrypt-btn');
      const decryptBtn = document.getElementById('decrypt-btn');
      const copyBtn = document.getElementById('copy-btn');
      const downloadBtn = document.getElementById('download-btn');
      const clearInputBtn = document.getElementById('clear-input-btn');
      const clearOutputBtn = document.getElementById('clear-output-btn');
      const statusMessage = document.getElementById('status-message');

      const BACKEND_URL = 'http://127.0.0.1:5000/api';

      const cipherInfo = {
        aes_cbc: { hint: "Requires key/password. Uses AES in CBC mode." },
        aes_ctr: { hint: "Requires key/password. Uses AES in Counter mode." },
        aes_gcm: { hint: "Requires key/password. Uses AES in GCM mode." },
        autokey: { hint: "Requires text keyword." },
        chacha20: { hint: "Requires key/password. Uses ChaCha20-Poly1305." },
        columnar: { hint: "Requires key word/phrase." },
        fernet: { hint: "Requires key/passphrase." },
        playfair: { hint: "Requires key word/phrase." },
        vigenere: { hint: "Requires alphabetic key phrase." }
      };

      function updateAlgorithmUI() {
        const selected = algorithmSelect.value;
        const config = cipherInfo[selected] || { hint: '' };
        algorithmHint.textContent = config.hint;
      }

      algorithmSelect.addEventListener('change', updateAlgorithmUI);
      updateAlgorithmUI();

      toggleKeyBtn.addEventListener('click', () => {
        const isPassword = keyInput.type === 'password';
        keyInput.type = isPassword ? 'text' : 'password';
        toggleKeyIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });

      function showStatus(message, type = 'error') {
        statusMessage.textContent = message;
        statusMessage.className = `status-message ${type}`;
      }

      function hideStatus() {
        statusMessage.className = 'status-message hidden';
      }

      async function processCipher(action) {
        hideStatus();
        const algorithm = algorithmSelect.value;
        const text = textInput.value.trim();
        const key = keyInput.value.trim();

        if (!text) {
          showStatus('Please enter text to process.', 'error');
          return;
        }

        if (!key) {
          showStatus('Secret key or password is required.', 'error');
          return;
        }

        const targetBtn = action === 'encrypt' ? encryptBtn : decryptBtn;
        const originalText = targetBtn.innerHTML;
        targetBtn.disabled = true;
        targetBtn.innerHTML = `Processing...`;

        try {
          const response = await fetch(`${BACKEND_URL}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ algorithm, text, key })
          });

          const data = await response.json();

          if (!response.ok || data.error) {
            showStatus(data.error || 'An error occurred during calculation.', 'error');
            textOutput.value = '';
          } else {
            textOutput.value = data.result;
            showStatus(`Success!`, 'success');
          }
        } catch (err) {
          showStatus('Unable to reach local backend server.', 'error');
        } finally {
          targetBtn.disabled = false;
          targetBtn.innerHTML = originalText;
        }
      }

      encryptBtn.addEventListener('click', () => processCipher('encrypt'));
      decryptBtn.addEventListener('click', () => processCipher('decrypt'));

      clearInputBtn.addEventListener('click', () => {
        textInput.value = '';
        hideStatus();
      });

      clearOutputBtn.addEventListener('click', () => {
        textOutput.value = '';
        hideStatus();
      });

      copyBtn.addEventListener('click', () => {
        if (!textOutput.value) {
          showStatus('No output text to copy.', 'error');
          return;
        }
        textOutput.select();
        try {
          document.execCommand('copy');
          showStatus('Copied to clipboard!', 'success');
        } catch (err) {
          showStatus('Failed to copy.', 'error');
        }
      });

      downloadBtn.addEventListener('click', () => {
        const text = textOutput.value;
        if (!text) {
          showStatus('No output text to download.', 'error');
          return;
        }

        const algo = algorithmSelect.value;
        const filename = `${algo}_result.txt`;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        
        const element = document.createElement('a');
        element.setAttribute('href', URL.createObjectURL(blob));
        element.setAttribute('download', filename);
        element.style.display = 'none';
        
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
        
        showStatus(`Saved as ${filename}`, 'success');
      });
    });
  </script>
</body>
</html>
